name: generating_pdf_reports
on: push
jobs:
  pdf_report:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: sudo apt-get install -y inkscape pandoc texlive-xetex texlive-fonts-recommended texlive-plain-generic texlive-latex-extra
      - run: pip install ipykernel nbconvert pint open-atmos-jupyter-utils scipy PyMPDATA-examples matplotlib numpy
      - run: python -m nbconvert --to pdf --execute projekt1/projekt.ipynb
      - uses: actions/upload-artifact@v4
        with:
          path: projekt1/projekt.pdf